<script>
'use strict';
const $ = id => document.getElementById(id);
const demo = new URLSearchParams(location.search).get('demo') === '1';
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const stage = $('stage');
function fit(){stage.style.setProperty('--scale',Math.min(innerWidth/1920,innerHeight/872));}
addEventListener('resize',fit);fit();
const clockFormat = new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const timeText = seconds => clockFormat.format(new Date(seconds*1000));
const duration = seconds => Math.floor(seconds/60)+':'+String(Math.floor(seconds%60)).padStart(2,'0');
const numberText = value => value.toLocaleString('en-US');
let prev=null,connection='waiting',busy=false;
let countValue, digitTracks=[],celebrationTimer,demoSloshLogged=false;

// Only the debounced count received from /state can move the number reels.
function setCount(value){
  if(value===countValue)return;
  const text=value==null?'-----':String(value).padStart(5,'0'),digits=[...text];
  const old=countValue==null?'':String(countValue).padStart(5,'0');
  if(digitTracks.length!==digits.length){
    $('counter').replaceChildren();digitTracks=[];
    for(const digit of digits){
      const cell=document.createElement('div');cell.className='digit';cell.setAttribute('aria-hidden','true');
      const track=document.createElement('div');track.className='digit-track';
      cell.append(track);$('counter').append(cell);digitTracks.push(track);
    }
  }
  const width=Math.min(digits.length>5?100:128,(680-(digits.length-1)*7)/digits.length);
  digitTracks.forEach((track,i)=>{
    track.parentElement.style.width=width+'px';
    track.getAnimations().forEach(animation=>animation.cancel());track.replaceChildren();
    const next=document.createElement('span');next.textContent=digits[i];next.style.fontSize=Math.min(124,width*1.29)+'px';
    if(old&&old[i]!==digits[i]&&value>countValue&&!reducedMotion.matches){
      const before=next.cloneNode();before.textContent=old[i]||'0';track.append(before,next);
      track.style.transform='translateY(-140px)';
      track.animate([{transform:'translateY(0)'},{transform:'translateY(-140px)'}],{duration:730+i*70,easing:'cubic-bezier(.2,.8,.2,1)'});
    }else{track.append(next);track.style.transform='translateY(0)';}
  });
  $('counter').setAttribute('aria-label',value==null?'Flush count unknown':numberText(value)+' flushes today');countValue=value;
}
setCount(null);
function event(text,timestamp,kind=''){
  const list=$('events');list.querySelector('.events-empty')?.remove();
  const item=document.createElement('li');item.className='event-enter '+kind;
  const time=document.createElement('time');time.textContent=timeText(timestamp);time.dateTime=new Date(timestamp*1000).toISOString();
  const label=document.createElement('span');label.className='event-text';label.textContent='· '+text;label.title=text;
  item.append(time,label);list.prepend(item);while(list.children.length>3)list.lastElementChild.remove();
}
function health(level,title,detail){
  stage.dataset.severity=level.toLowerCase();$('status').textContent=level;
  $('healthSymbol').textContent=level==='OK'?'✓':level==='WARN'?'⚠':'✕';
  $('healthTitle').textContent=title;$('healthDetail').textContent=detail;
}
function unknownSwitch(){
  $('tankArt').classList.add('unknown');$('tankArt').classList.remove('raw-down');
  $('tankState').textContent='? TANK UNKNOWN';$('tankDescription').textContent='No current switch reading. Water and float position are unknown.';
}
function celebrate(){
  const layer=$('celebration');clearTimeout(celebrationTimer);stage.classList.remove('celebrating');
  layer.querySelectorAll('.particle').forEach(p=>p.remove());void stage.offsetWidth;stage.classList.add('celebrating');
  if(!reducedMotion.matches){
    for(let i=0;i<32;i++){
      const p=document.createElement('i');p.className='particle '+(i%3===0?'bubble-particle':'');
      if(i%3!==0)p.style.background=['#f1a21a','#f1efe4','#c0dcdf','#c2ba51'][i%4];layer.append(p);
      const angle=i/32*Math.PI*2,distance=170+(i%7)*38;
      p.animate([{transform:'translate(0,0) rotate(0deg)',opacity:0},{opacity:1,offset:.12},{transform:'translate('+(Math.cos(angle)*distance)+'px,'+(Math.sin(angle)*distance-90)+'px) rotate('+(i*37)+'deg)',opacity:0}],{duration:1300+(i%5)*110,easing:'cubic-bezier(.1,.6,.3,1)',fill:'forwards'});
    }
  }
  celebrationTimer=setTimeout(()=>{stage.classList.remove('celebrating');layer.querySelectorAll('.particle').forEach(p=>p.remove());},1900);
}
function applyState(s){
  if(!s||typeof s!=='object'||typeof s.stale!=='boolean'||!Number.isFinite(s.now))throw new Error('Invalid state');
  if(!s.stale&&!['full','low'].includes(s.tank))throw new Error('Invalid tank');
  const floatUp='float_up' in s?s.float_up:s.switch_closed;
  const low=s.tank==='low',up=floatUp===true,known=typeof floatUp==='boolean',closed=s.switch_closed===true,wireKnown=typeof s.switch_closed==='boolean';
  const lowFor=low&&Number.isFinite(s.low_since)?Math.max(0,Math.floor(s.now-s.low_since)):0;
  const warn=Number.isFinite(s.warn)&&s.warn>0?s.warn:120,crit=Number.isFinite(s.crit)&&s.crit>0?s.crit:600;
  const today=Number.isSafeInteger(s.flushes_today)&&s.flushes_today>=0?s.flushes_today:null;
  const total=Number.isSafeInteger(s.flushes_total)&&s.flushes_total>=0?s.flushes_total:null;
  if(!s.stale&&((low&&!Number.isFinite(s.low_since))||today===null||total===null))throw new Error('Incomplete watcher data');
  // float_up instantly drives water/float targets; switch_closed is raw wire truth.
  // tank, low_since and counts come from the watcher's one-second debounce.
  unknownSwitch();
  if(known){
    $('tankArt').classList.remove('unknown');$('tankArt').classList.toggle('raw-down',!up);
    $('water').style.transform='translateY('+(up?0:180)+'px)';$('float').style.transform='translateY('+(up?0:180)+'px)';
    $('tankState').textContent=up?'▲ TANK FULL':'▼ WATER DROPPED';
  }
  if(wireKnown){
    $('reedBottom').setAttribute('d',closed?'M640 196V174':'M640 196V183');
  }
  const pairing=known?'Float '+(up?'up':'down')+(wireKnown?', circuit '+(closed?'closed, pin reads zero.':'open, pin reads one.'):', wire reading unavailable.'):'Float position unknown.';
  $('tankDescription').textContent=pairing+(known?(up?' The tank is full.':' The water has dropped.'):'');
  setCount(today);$('total').textContent=total===null?'—':numberText(total);
  $('last').textContent=Number.isFinite(s.last_flush)&&s.last_flush>0?timeText(s.last_flush):'NO FLUSH YET';
  $('clock').textContent=timeText(s.now);$('lowTime').textContent=duration(lowFor);
  $('warnRing').style.strokeDashoffset=389.56*(1-Math.min(1,lowFor/warn));$('critRing').style.strokeDashoffset=477.52*(1-Math.min(1,lowFor/crit));
  $('warnLabel').textContent='⚠ WARN AT '+duration(warn);$('critLabel').textContent='✕ CRIT AT '+duration(crit);
  $('warnLabel').classList.toggle('reached',lowFor>=warn);$('critLabel').classList.toggle('reached',lowFor>=crit);$('timerNote').textContent=low?'Time with tank low':'Ready for the next flush';
  if(s.stale){
    health('CRIT','ESP32 offline','ESP32 data is stale. Check Wi-Fi and the sensor.');
    $('timerNote').textContent='Last reported reading';
  }else{
    if(lowFor>=crit)health('CRIT','Tank low for '+duration(lowFor),'Check for running water or water off.');
    else if(lowFor>=warn)health('WARN','Tank low for '+duration(lowFor),'Check for running water or water off.');
    else if(!known)health('OK',low?'Tank low · switch unknown':'Tank full · switch unknown','ESP32 reporting; raw switch unavailable.');
    else if(low)health('OK',up?'Float returned · tank full':'Flush counted · tank low',pairing);
    else health('OK',up?'Tank full · ready to flush':'Water dropped · checking',pairing);
  }
  const nextConnection=s.stale?'stale':'connected';
  if(connection!==nextConnection)event(s.stale?'ESP32 offline':demo?'Demo feed connected':connection==='waiting'?'ESP32 feed connected':'ESP32 feed restored',s.now);
  if(!s.stale&&prev){
    const increased=(total!==null&&prev.total!==null&&total>prev.total)||(today!==null&&prev.today!==null&&today>prev.today&&s.day===prev.day);
    if(increased){celebrate();event('FLUSH #'+(today===null?'?':numberText(today)),s.last_flush||s.now,'event-flush');}
    if(known&&up&&prev.up===false)event(prev.low?'Tank refilled':'Float returned · no new flush',s.now);
    if(lowFor>=warn&&prev.lowFor<warn)event('⚠ WARN · tank still low',s.now);
    if(lowFor>=crit&&prev.lowFor<crit)event('✕ CRIT · tank still low',s.now);
  }
  if(demo&&demoPhase()>=9.6&&demoPhase()<10.2&&!demoSloshLogged){event('Slosh ignored · no count',s.now);demoSloshLogged=true;}
  if(demo&&demoPhase()<9)demoSloshLogged=false;
  prev={today,total,day:s.day,up:known?up:null,low,lowFor};connection=nextConnection;
}
function failed(){
  health('CRIT','ESP32 not reporting','Connection lost. Check the ESP32.');unknownSwitch();
  $('lowTime').textContent='--:--';$('timerNote').textContent='No current reading';
  $('warnRing').style.strokeDashoffset=389.56;$('critRing').style.strokeDashoffset=477.52;
  if(connection!=='failed')event('✕ ESP32 not reporting',Date.now()/1000);connection='failed';
}
// Same /state fields, no network requests in demo. Five flushes/minute;
// a 0.6s slosh never counts. One long low uses a clearly labelled 20× clock.
const demoStart=performance.now(),demoEpoch=Date.now()/1000;
const demoPhase=()=>((performance.now()-demoStart)/1000)%60;
function demoState(){
  const elapsed=(performance.now()-demoStart)/1000,cycle=Math.floor(elapsed/60),p=elapsed%60;
  const starts=[3,15,27,39,51],current=starts.find(t=>p>=t&&p<t+(t===51?8:4));
  const slosh=p>=9&&p<9.6,down=current!==undefined||slosh,counted=current!==undefined&&p>=current+1;
  const completed=starts.filter(t=>p>=t+1).length,n=cycle*5+completed;
  const virtualAt=phase=>phase+Math.max(0,Math.min(phase-51,8))*19;
  const now=demoEpoch+cycle*212+virtualAt(p),lastStart=starts.filter(t=>p>=t+1).at(-1);
  const lastFlush=lastStart!==undefined?demoEpoch+cycle*212+virtualAt(lastStart+1):cycle>0?demoEpoch+(cycle-1)*212+virtualAt(52):null;
  return {tank:counted?'low':'full',low_since:counted?demoEpoch+cycle*212+virtualAt(current):null,flushes_total:1432+n,flushes_today:6+n,day:new Date(demoEpoch*1000).toLocaleDateString('en-CA'),last_flush:lastFlush,updated:now,now,stale:false,switch_closed:down,float_up:!down,warn:120,crit:600};
}
async function tick(){
  if(busy)return;busy=true;
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),1800);
  try{
    if(demo)applyState(demoState());
    else{
      const response=await fetch('/api/toilet/state',{cache:'no-store',signal:controller.signal});
      if(!response.ok)throw new Error('HTTP '+response.status);applyState(await response.json());
    }
  }catch{failed();}finally{clearTimeout(timeout);busy=false;}
}
tick();setInterval(tick,1000);
</script></body></html>
